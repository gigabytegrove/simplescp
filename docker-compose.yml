services:
  simplescp:
    build: .
    image: ghcr.io/gigabytegrove/simplescp:latest
    container_name: simplescp
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SIMPLE_SCP_LISTEN: ":8080"
      SIMPLE_SCP_DATA_DIR: "/data"
      SIMPLE_SCP_MASTER_KEY: "${SIMPLE_SCP_MASTER_KEY:-}"
      SIMPLE_SCP_MASTER_KEY_FILE: "${SIMPLE_SCP_MASTER_KEY_FILE:-}"
      SIMPLE_SCP_ADMIN_USER: "${SIMPLE_SCP_ADMIN_USER:-admin}"
      SIMPLE_SCP_ADMIN_PASSWORD: "${SIMPLE_SCP_ADMIN_PASSWORD:-}"
      SIMPLE_SCP_ADMIN_PASSWORD_FILE: "${SIMPLE_SCP_ADMIN_PASSWORD_FILE:-}"
      SIMPLE_SCP_COOKIE_SECURE: "${SIMPLE_SCP_COOKIE_SECURE:-false}"
      SIMPLE_SCP_SESSION_TTL: "${SIMPLE_SCP_SESSION_TTL:-24h}"
      SIMPLE_SCP_SSH_TIMEOUT: "${SIMPLE_SCP_SSH_TIMEOUT:-15s}"
      SIMPLE_SCP_MAX_UPLOAD_BYTES: "${SIMPLE_SCP_MAX_UPLOAD_BYTES:-10737418240}"
      SIMPLE_SCP_MAX_CONCURRENT_TRANSFERS: "${SIMPLE_SCP_MAX_CONCURRENT_TRANSFERS:-4}"
      SIMPLE_SCP_LOGIN_MAX_ATTEMPTS: "${SIMPLE_SCP_LOGIN_MAX_ATTEMPTS:-5}"
      SIMPLE_SCP_LOGIN_WINDOW: "${SIMPLE_SCP_LOGIN_WINDOW:-15m}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    volumes:
      - simplescp_data:/data

volumes:
  simplescp_data:
