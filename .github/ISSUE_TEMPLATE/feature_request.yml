name: Feature request
description: Suggest an improvement to SimpleSCP
title: "[Feature] "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to accomplish?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: security
    attributes:
      label: Security considerations
      description: Does this affect credentials, SSH trust, network reachability, file deletion, authentication, or permissions?
