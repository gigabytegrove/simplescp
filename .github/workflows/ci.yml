name: CI

on:
  push:
    branches: [main]
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: simplescp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Resolve modules
        run: go mod tidy

      - name: Verify module files are clean
        run: git diff --exit-code -- go.mod go.sum

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.8.0

      - name: Vulnerability scan
        run: govulncheck ./...

      - name: Build
        run: |
          go build ./cmd/simplescp
          go build ./cmd/simplescp-desktop

      - name: Build container
        run: docker build -t simplescp:ci .

  publish:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/gigabytegrove/simplescp
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  live-release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[no-live]')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Wait for main to settle
        id: settle
        shell: bash
        run: |
          set -euo pipefail
          sleep 60
          LATEST="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          if [ "$LATEST" = "$GITHUB_SHA" ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "main is settled on $GITHUB_SHA"
          else
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Live release because main advanced to $LATEST"
          fi

      - name: Build Live updater assets
        if: steps.settle.outputs.publish == 'true'
        shell: bash
        run: |
          set -euo pipefail
          LIVE_TAG="v1.0.${GITHUB_RUN_NUMBER}"
          BOOTSTRAP_TAG="edge-bootstrap-${GITHUB_SHA:0:12}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "LIVE_TAG=$LIVE_TAG" >> "$GITHUB_ENV"
          echo "BOOTSTRAP_TAG=$BOOTSTRAP_TAG" >> "$GITHUB_ENV"

          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/gigabytegrove/simplescp/internal/buildinfo.Version=$LIVE_TAG -X github.com/gigabytegrove/simplescp/internal/buildinfo.Commit=${GITHUB_SHA} -X github.com/gigabytegrove/simplescp/internal/buildinfo.BuildTime=$BUILD_TIME" \
              -o "dist/simplescp-linux-$arch" ./cmd/simplescp

            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w" \
              -o "dist/simplescp-desktop-linux-$arch" ./cmd/simplescp-desktop

            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w" \
              -o "dist/simplescp-desktop-windows-$arch.exe" ./cmd/simplescp-desktop
          done
          (
            cd dist
            sha256sum simplescp-linux-* simplescp-desktop-* > SHA256SUMS
          )

      - name: Publish Live release
        if: steps.settle.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$LIVE_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --latest \
            --title "SimpleSCP $LIVE_TAG" \
            --notes "Live release from main at commit $GITHUB_SHA."

      - name: Publish legacy updater bootstrap
        if: steps.settle.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$BOOTSTRAP_TAG" dist/* \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "SimpleSCP updater bootstrap" \
            --notes "Compatibility bootstrap for older Edge-channel containers. The binary itself is $LIVE_TAG."

      - name: Remove obsolete Edge releases
        if: steps.settle.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 100 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease == true) | .tagName' |
          while IFS= read -r tag; do
            case "$tag" in
              edge|edge-*)
                if [ "$tag" != "$BOOTSTRAP_TAG" ]; then
                  gh release delete "$tag" --yes
                fi
                ;;
            esac
          done

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.1"
          cache: true

      - name: Build updater assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath \
              -ldflags="-s -w -X github.com/gigabytegrove/simplescp/internal/buildinfo.Version=${GITHUB_REF_NAME} -X github.com/gigabytegrove/simplescp/internal/buildinfo.Commit=${GITHUB_SHA}" \
              -o "dist/simplescp-linux-$arch" ./cmd/simplescp
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/simplescp-desktop-linux-$arch" ./cmd/simplescp-desktop
            CGO_ENABLED=0 GOOS=windows GOARCH="$arch" go build -trimpath -ldflags="-s -w" -o "dist/simplescp-desktop-windows-$arch.exe" ./cmd/simplescp-desktop
          done
          (
            cd dist
            sha256sum simplescp-linux-* simplescp-desktop-* > SHA256SUMS
          )

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "SimpleSCP $GITHUB_REF_NAME"
          fi
